[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ayol377/sentinelone-rs"
authors = ["ayaal <ayaal.ali@proton.me>"]

[workspace.dependencies]
# external
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
url = "2"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# internal (path deps; package names, not lib names)
sentinelone-http = { path = "crates/sentinelone-http" }
sentinelone-api-rs = { path = "crates/sentinelone-api-rs" }
sentinelone-xdr-api-rs = { path = "crates/sentinelone-xdr-api-rs" }

[profile.release]
lto = "thin"
