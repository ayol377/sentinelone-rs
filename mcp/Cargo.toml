[package]
name = "sentinelone-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-tenant MCP server exposing SentinelOne (mgmt + XDR) to LLM analyst agents."

[[bin]]
name = "sentinelone-mcp"
path = "src/main.rs"

[dependencies]
sentinelone-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-std", "io-util", "signal", "time"] }
axum = "0.8"
